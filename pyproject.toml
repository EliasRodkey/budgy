[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budgy"
version = "2.0.4"
description = "budget managing application"
authors = [{name = "Elias Rodkey", email = "elias.rodkey@gmail.com"}]
license = {text = "All Rights Reserved"}
dependencies = [
    "requests",
    "numpy",
    "pandas",
    "sqlalchemy",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pleasant_loggers",
    "pleasant_database",
    "anthropic",
    "python-dotenv"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-dotenv"]

[tool.pytest.ini_options]
markers = [
    "ai_integration: marks tests that make real AI API calls (run with -m ai_integration)",
]
env_files = ".env"